name: Provjera

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  provjeri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instaliraj ovisnosti
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Provjeri Python datoteke
        run: python -m compileall -q app.py service_catalog.py
