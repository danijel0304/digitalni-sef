name: Release v1.0.5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.0.5-once.yml'

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller
      - name: Set package version
        shell: pwsh
        run: Set-Content -Path digitalni_sef_version.txt -Value 'v1.0.5' -NoNewline
      - name: Build EXE
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name Digitalni-sef
          --add-data "assets;assets" --add-data "digitalni_sef_version.txt;." app.py;
          New-Item -ItemType Directory -Force release | Out-Null;
          Copy-Item dist\Digitalni-sef.exe "release\digitalni-sef-v1.0.5-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-v1.0.5
          path: release/*.exe
          if-no-files-found: error

  linux:
    name: Linux DEB RPM TAR AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 rpm wget
          python -m pip install --upgrade pip -r requirements.txt pyinstaller
      - name: Set package version
        run: printf '%s' 'v1.0.5' > digitalni_sef_version.txt
      - name: Build application
        run: >-
          pyinstaller --noconfirm --clean --windowed --name Digitalni-sef
          --add-data "assets:assets" --add-data "digitalni_sef_version.txt:." app.py
      - name: Download AppImage tool
        run: |
          wget -q -O appimagetool-x86_64.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage scripts/build_linux_artifacts.sh
      - name: Build Linux packages
        env:
          VERSION: v1.0.5
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool-x86_64.AppImage
        run: scripts/build_linux_artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-v1.0.5
          path: release/*
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish v1.0.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.5 release-artifacts/* --generate-notes --repo "${{ github.repository }}"
